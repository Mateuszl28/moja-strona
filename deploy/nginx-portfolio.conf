# ──────────────────────────────────────────────────────────────────────────
# nginx — portfolio Mateusz Łagocki (reverse proxy do Next.js na :3000)
#
# UWAGA „jajko i kura": blok :443 niżej odwołuje się do certyfikatu, którego
# na świeżym serwerze JESZCZE NIE MA — więc `nginx -t` na tym pliku najpierw
# zgłosi błąd. Dlatego zdobądź certyfikat ZANIM wstawisz pełny config. Kolejność:
#
# WYMAGANIA WSTĘPNE:
#   • DNS: programujzmateuszem.pl (i www) wskazuje A/AAAA na IP tego serwera.
#   • Aplikacja Next.js działa na localhost:3000 (np. pm2 / systemd).
#   • sudo apt install certbot
#
# KROK 1 — tymczasowo TYLKO HTTP (żeby zdobyć certyfikat metodą webroot):
#   Zostaw na serwerze sam blok `server { listen 80; ... }` z tego pliku
#   (zakomentuj/usuń blok :443), potem:
#     sudo mkdir -p /var/www/html
#     sudo nginx -t && sudo systemctl reload nginx
#
# KROK 2 — wygeneruj certyfikat (nie dotyka configu, tylko webroot):
#     sudo certbot certonly --webroot -w /var/www/html \
#       -d programujzmateuszem.pl -d www.programujzmateuszem.pl
#
# KROK 3 — odkomentuj blok :443 (cert już istnieje), zwaliduj i przeładuj:
#     sudo nginx -t && sudo systemctl reload nginx
#
# ODNAWIANIE: certbot instaluje timer; sprawdź `systemctl list-timers | grep certbot`.
#   Test odnowienia na sucho: sudo certbot renew --dry-run
#
# Alternatywa (gdy nie chcesz ręcznie): `sudo apt install python3-certbot-nginx`
#   i `sudo certbot --nginx -d programujzmateuszem.pl -d www...` — ale URUCHOM TO
#   na configu BEZ bloku :443 (plugin sam dopisze TLS). Inaczej `nginx -t` padnie.
# ──────────────────────────────────────────────────────────────────────────

# Limit rozmiaru zapytania (formularz kontaktowy i tak idzie do web3forms, ale na zapas)
client_max_body_size 2m;

# ───── Gzip ─────
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain text/css text/javascript application/javascript
    application/json application/xml image/svg+xml font/woff2;

# ───── HTTP :80 → przekierowanie na HTTPS ─────
server {
    listen 80;
    listen [::]:80;
    server_name programujzmateuszem.pl www.programujzmateuszem.pl;

    # Pozostaw odsłonięte wyzwanie ACME, żeby odnawianie certyfikatu działało.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ───── HTTPS :443 ─────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name programujzmateuszem.pl www.programujzmateuszem.pl;

    # Ścieżki wstawi/zaktualizuje certbot. Jeśli konfigurujesz ręcznie — podmień.
    ssl_certificate     /etc/letsencrypt/live/programujzmateuszem.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/programujzmateuszem.pl/privkey.pem;

    # ── Parametry TLS ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Nagłówki bezpieczeństwa ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Cache dla statyków Next.js (są hashowane → bezpieczny długi cache) ──
    location /_next/static/ {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Reszta ruchu → aplikacja Next.js ──
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
